[project]
name = "two-hit"
version = "0.1.0"
description = "Integrated mutation + copy number analysis for biallelic inactivation and oncogene amplification"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
    "plotly>=5.18",
    "httpx>=0.27",
]

[project.scripts]
two-hit = "two_hit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/two_hit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "marimo>=0.10",
    "kaleido>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
